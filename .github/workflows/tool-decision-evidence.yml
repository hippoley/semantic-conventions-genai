name: Tool decision evidence verifier
on:
  push:
    branches:
      - evidence/foreman-correlation-check-20261012
  pull_request:
    paths:
      - 'tools/verify_tool_decision_evidence.py'
      - 'tests/test_tool_decision_evidence.py'
      - '.github/workflows/tool-decision-evidence.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s tests -p test_tool_decision_evidence.py -v
